<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friend Card</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f2f3f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 20px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .green {
            background: #06c755;
            color: white;
        }

        .black {
            background: #222;
            color: white;
        }

    </style>

</head>


<body>


<div class="card">


    <img
        class="image"
        src="https://placehold.co/800x500"
        alt="Friend Card"
    >


    <div class="content">


        <div class="title">
            🎉 โปรโมชั่นพิเศษ
        </div>


        <div class="description">

            รายละเอียดโปรโมชั่นหรือข้อความ
            ที่คุณต้องการสามารถใส่ตรงนี้ได้เลย

        </div>


        <button
            class="button green"
            onclick="sendFlexCard()"
        >
            📤 ส่งการ์ดให้เพื่อน
        </button>


    </div>


</div>



<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>


const LIFF_ID = "2011088879-uJOA8rZe";


async function initLIFF() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        console.log("LIFF Ready");

    }

    catch (error) {

        console.error("LIFF Error:", error);

    }

}



async function sendFlexCard() {


    if (!liff.isApiAvailable("shareTargetPicker")) {

        alert(
            "ไม่สามารถเปิดหน้าส่งให้เพื่อนได้\n\n" +
            "กรุณาเปิดหน้านี้ผ่าน LIFF ในแอป LINE"
        );

        return;

    }



    const flexMessage = {

        type: "flex",

        altText: "🎉 โปรโมชั่นพิเศษ",

        contents: {

            type: "bubble",


            hero: {

                type: "image",

                url: "https://placehold.co/800x500",

                size: "full",

                aspectRatio: "20:13",

                aspectMode: "cover"

            },


            body: {

                type: "box",

                layout: "vertical",

                spacing: "md",

                contents: [

                    {

                        type: "text",

                        text: "🎉 โปรโมชั่นพิเศษ",

                        weight: "bold",

                        size: "xl"

                    },


                    {

                        type: "text",

                        text: "รายละเอียดโปรโมชั่นหรือข้อความที่คุณต้องการ",

                        wrap: true,

                        color: "#555555"

                    }

                ]

            },


            footer: {

                type: "box",

                layout: "vertical",

                spacing: "sm",

                contents: [

                    {

                        type: "button",

                        style: "primary",

                        action: {

                            type: "uri",

                            label: "ดูรายละเอียด",

                            uri: "https://lrb053.github.io/FriendCard/"

                        }

                    }

                ]

            }

        }

    };



    try {


        await liff.shareTargetPicker([

            flexMessage

        ]);


    }

    catch (error) {

        console.error(error);

        alert(
            "เกิดข้อผิดพลาดในการส่งการ์ด"
        );

    }

}



initLIFF();


</script>


</body>

</html>
