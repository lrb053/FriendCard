<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friend Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f2f3f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 20px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .green {
            background: #06c755;
            color: white;
        }

        .black {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            class="image"
            src="https://placehold.co/800x500"
            alt="Friend Card"
        >

        <div class="content">

            <div class="title">
                🎉 โปรโมชั่นพิเศษ
            </div>

            <div class="description">
                รายละเอียดโปรโมชั่นหรือข้อความที่คุณต้องการ
                สามารถใส่ตรงนี้ได้เลย
            </div>

            <a
                class="button green"
                href="#"
            >
                ดูรายละเอียด
            </a>

            <button
                class="button black"
                onclick="shareCard()"
            >
                📤 ส่งให้เพื่อน
            </button>

        </div>

    </div>

    <script>

        function shareCard() {

            alert("เดี๋ยวเราจะเชื่อมระบบส่งให้เพื่อนกับ LINE");

        }

    </script>

</body>
</html>
